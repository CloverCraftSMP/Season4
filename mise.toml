[tools]
go = "latest"
"go:github.com/packwiz/packwiz" = "latest"
hk = { version = "latest", workflow = "release.yml" }
java = "temurin-25"
jq = "latest"
tombi = "latest"

[env]
# constants
_.file = ".env"
MISE_ROOT = "{{config_root}}/.mise"
MISE_TASKS_ROOT = "$MISE_ROOT/tasks"
MISE_LIB = "$MISE_ROOT/lib"

# pack versions
UNSUP_VERSION = "1.3.0"
MINECRAFT_VERSION = "26.1.2"
FABRIC_LOADER = "0.20.1"

# config
MODPACK_WIKIJS_URL = "https://wiki.clovercraftsmp.com"

# packdev
PACKDEV_CHANNEL = "dev"  # dev | staging | prod
PACKDEV_REPO_SLUG = "CloverCraft/Season4"
PACKDEV_REPO_RAW = "https://raw.githubusercontent.com/$PACKDEV_REPO_SLUG"
PACKDEV_REPO_URL = "https://github.com/$PACKDEV_REPO_SLUG"
PACKDEV_BUILD_ROOT = "{{config_root}}/build"
PACKDEV_RUN_ROOT = "{{config_root}}/run"
PACKDEV_SERVER_ROOT = "$PACKDEV_RUN_ROOT/server"

[tasks.pre-commit]
run = "hk run pre-commit"
