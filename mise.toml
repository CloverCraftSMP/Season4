[tools]
java = "temurin-25"
jq = "latest"
go = "latest"
"go:github.com/itzg/mc-monitor" = "latest"
act = "latest"

[hooks]
postinstall = { task = "pakku:update" }

[tasks."pakku:update"]
description = "Downloads or updates the latest pakku.jar"
run = """
mkdir -p .mise
curl -sLo .mise/pakku.jar "https://github.com/juraj-hrivnak/Pakku/releases/latest/download/pakku.jar"
echo "Pakku updated successfully!"
"""
run_windows = [
    "if not exist .mise mkdir .mise",
    "curl -sLo .mise/pakku.jar \"https://github.com/juraj-hrivnak/Pakku/releases/latest/download/pakku.jar\"",
    "echo Pakku updated successfully!"
]

[tasks."prism:setup"]
description = "Generates a drag-and-drop Prism instance linked to this repository"
run = """
if [ ! -f pakku-lock.json ]; then
    echo "pakku-lock.json not found!"
    exit 1
fi

echo "Reading versions from pakku-lock.json..."
MC_VERSION=$(jq -r '.mc_versions[0]' pakku-lock.json)
FABRIC_VERSION=$(jq -r '.loaders.fabric' pakku-lock.json)
echo "Detected Minecraft $MC_VERSION with Fabric $FABRIC_VERSION"

mkdir -p .mise/prism-instance

cat << EOF > .mise/prism-instance/mmc-pack.json
{
    "components": [
        { "important": true, "uid": "net.minecraft", "version": "${MC_VERSION}" },
        { "uid": "net.fabricmc.fabric-loader", "version": "${FABRIC_VERSION}" }
    ],
    "formatVersion": 1
}
EOF

REPO_PATH=$(pwd)
cat << EOF > .mise/prism-instance/instance.cfg
[General]
InstanceType=OneSix
OverrideCommands=true
PreLaunchCommand=\\$INST_JAVA "-Ddev.repo.path=${REPO_PATH}" "${REPO_PATH}/DevLaunch.java"
OverridePerformance=true
EnableMangoHud=true
EOF

cd .mise/prism-instance
jar cMf "../Season 4 Dev.zip" *
cd ../..

echo "Success! Drag and drop '.mise/Season 4 Dev.zip' into Prism Launcher to import it."
"""
run_windows = [
    "if not exist pakku-lock.json ( echo pakku-lock.json not found! & exit /b 1 )",
    "if not exist .mise\\prism-instance mkdir .mise\\prism-instance",

    "echo Reading versions from pakku-lock.json and generating Prism pack...",

    "jq \"{ components: [ { important: true, uid: \\\"net.minecraft\\\", version: .mc_versions[0] }, { uid: \\\"net.fabricmc.fabric-loader\\\", version: .loaders.fabric } ], formatVersion: 1 }\" pakku-lock.json > .mise\\prism-instance\\mmc-pack.json",
    
    "echo [General]> .mise\\prism-instance\\instance.cfg",
    "echo InstanceType=OneSix>> .mise\\prism-instance\\instance.cfg",
    "echo OverrideCommands=true>> .mise\\prism-instance\\instance.cfg",
    "echo PreLaunchCommand=$INST_JAVA \"-Ddev.repo.path=%CD:\\=/%\" \"%CD:\\=/%/DevLaunch.java\">> .mise\\prism-instance\\instance.cfg",

    "cd .mise\\prism-instance && jar cMf \"../Season 4 Dev.zip\" *",
    
    "echo Success! Drag and drop '.mise/Season 4 Dev.zip' into Prism Launcher to import it."
]

[tasks."setup:fabric-jar"]
description = "Downloads and caches the Fabric server jar matching pakku-lock.json"
run = """
if [ ! -f pakku-lock.json ]; then
    echo "Error: pakku-lock.json not found in root directory!"
    exit 1
fi
 
MC_VERSION=$(jq -r '.mc_versions[0]' pakku-lock.json)
FABRIC_VERSION=$(jq -r '.loaders.fabric' pakku-lock.json)
INSTALLER_VERSION="1.0.1"
SERVER_JAR_CACHE=".mise/fabric-server-${MC_VERSION}-${FABRIC_VERSION}.jar"
 
if [ ! -f "$SERVER_JAR_CACHE" ]; then
    echo "Downloading Fabric Server $FABRIC_VERSION for MC $MC_VERSION..."
    mkdir -p .mise
    curl -sLo "$SERVER_JAR_CACHE" "https://meta.fabricmc.net/v2/versions/loader/${MC_VERSION}/${FABRIC_VERSION}/${INSTALLER_VERSION}/server/jar"
else
    echo "Fabric server jar already cached at $SERVER_JAR_CACHE"
fi
"""


[tasks.pakku]
description = "Runs the local Pakku jar"
run = "java -jar .mise/pakku.jar"

[tasks."clean:build"]
description = "Removes generated export artifacts"
run = "rm -rf build .ci/artifacts"

[tasks."clean:server-test"]
description = "Removes the local test server"
run = "rm -rf .ci/server-test"

[tasks.clean]
description = "Removes all generated build and staging output"
depends = ["clean:build", "clean:server-test"]
run = "echo 'Workspace cleaned.'"

[tasks."ci:export"]
description = "Exports all profiles (mrpack and serverpack) into the .ci/artifacts folder"
depends = ["clean:build"]
run = """
mkdir -p .ci/artifacts

echo "Exporting profiles via Pakku..."
java --enable-native-access=ALL-UNNAMED -jar .mise/pakku.jar export

echo "Organizing artifacts..."
mv build/serverpack/*.zip .ci/artifacts/
mv build/modrinth/*.mrpack .ci/artifacts/

rm -rf build
echo "Artifacts generated successfully in .ci/artifacts/"
"""

[tasks."ci:stage-server"]
description = "Stages the Minecraft server environment for the boot test"
depends = ["clean:server-test"]
wait_for = ["ci:export"]
run = """
mkdir -p .ci/server-test

echo "Unzipping deploy artifact for testing..."
unzip -q .ci/artifacts/*.zip -d .ci/server-test/

echo "Accepting EULA..."
echo "eula=true" > .ci/server-test/eula.txt
"""

[tasks."ci:test-server"]
description = "Boots the Fabric server and waits for it to become healthy"
depends = ["setup:fabric-jar"]
wait_for = ["ci:stage-server"]
run = """
MC_VERSION=$(jq -r '.mc_versions[0]' pakku-lock.json)
FABRIC_VERSION=$(jq -r '.loaders.fabric' pakku-lock.json)
cp "$MISE_PROJECT_ROOT/.mise/fabric-server-${MC_VERSION}-${FABRIC_VERSION}.jar" .ci/server-test/fabric-server.jar

cd .ci/server-test

echo "Starting test server..."
java -Xmx2G -Djava.awt.headless=true -jar fabric-server.jar nogui &
SERVER_PID=$!

echo "Waiting for server to become healthy (Timeout: 4 minutes)..."
TIMEOUT=240
ELAPSED=0
INTERVAL=5

while ! mc-monitor status -host localhost -port 25565 > /dev/null 2>&1; do
    # If the process crashed and died, fail early
    if ! kill -0 $SERVER_PID 2>/dev/null; then
        echo "========================================="
        echo "FAILURE: Server process crashed during boot!"
        echo "========================================="
        exit 1
    fi

    if [ $ELAPSED -ge $TIMEOUT ]; then
        echo "========================================="
        echo "FAILURE: Server failed to start within 4 minutes."
        echo "========================================="
        kill $SERVER_PID
        exit 1
    fi
    
    sleep $INTERVAL
    ELAPSED=$((ELAPSED + INTERVAL))
done

echo "========================================="
echo "SUCCESS: Server booted and is responding!"
echo "========================================="
kill $SERVER_PID
exit 0
"""

[tasks."ci:update-mods"]
description = "Updates all projects in the modpack to their latest versions"
run = "java --enable-native-access=ALL-UNNAMED -jar .mise/pakku.jar update -a"

[tasks."ci:pipeline"]
description = "Runs the full pipeline in one shot"
depends = ["ci:export", "ci:stage-server", "ci:test-server"]
run = "echo 'CI pipeline passed locally.'"


[tasks."dev:server"]
description = "Stages and interactively runs the local dev server"
depends = ["ci:export", "ci:stage-server", "setup:fabric-jar"]
run = """
MC_VERSION=$(jq -r '.mc_versions[0]' pakku-lock.json)
FABRIC_VERSION=$(jq -r '.loaders.fabric' pakku-lock.json)
cp ".mise/fabric-server-${MC_VERSION}-${FABRIC_VERSION}.jar" .ci/server-test/fabric-server.jar
 
cd .ci/server-test
java -Xmx4G -jar fabric-server.jar nogui
"""


[shell_alias]
pakku = "java -jar .mise/pakku.jar"

