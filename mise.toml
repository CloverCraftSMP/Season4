[tools]
java = "temurin-25"
jq = "latest"
go = "latest"
"go:github.com/itzg/mc-monitor" = "latest"
act = "latest"

[hooks]
postinstall = { task = "pakku:update" }

[tasks."pakku:update"]
description = "Downloads or updates the latest pakku.jar"
run = """
mkdir -p .mise
curl -sLo .mise/pakku.jar "https://github.com/juraj-hrivnak/Pakku/releases/latest/download/pakku.jar"
echo "Pakku updated successfully!"
"""
run_windows = [
    "if not exist .mise mkdir .mise",
    "curl -sLo .mise/pakku.jar \"https://github.com/juraj-hrivnak/Pakku/releases/latest/download/pakku.jar\"",
    "echo Pakku updated successfully!"
]

[tasks."prism:setup"]
description = "Generates a drag-and-drop Prism instance linked to this repository"
run = """
if [ ! -f pakku-lock.json ]; then
    echo "pakku-lock.json not found!"
    exit 1
fi

echo "Reading versions from pakku-lock.json..."
MC_VERSION=$(jq -r '.mc_versions[0]' pakku-lock.json)
FABRIC_VERSION=$(jq -r '.loaders.fabric' pakku-lock.json)
echo "Detected Minecraft $MC_VERSION with Fabric $FABRIC_VERSION"

mkdir -p .mise/prism-instance

cat << EOF > .mise/prism-instance/mmc-pack.json
{
    "components": [
        { "important": true, "uid": "net.minecraft", "version": "${MC_VERSION}" },
        { "uid": "net.fabricmc.fabric-loader", "version": "${FABRIC_VERSION}" }
    ],
    "formatVersion": 1
}
EOF

REPO_PATH=$(pwd)
cat << EOF > .mise/prism-instance/instance.cfg
[General]
InstanceType=OneSix
OverrideCommands=true
PreLaunchCommand=\\$INST_JAVA "-Ddev.repo.path=${REPO_PATH}" "${REPO_PATH}/DevLaunch.java"
OverridePerformance=true
EnableMangoHud=true
EOF

cd .mise/prism-instance
jar cMf "../Season 4 Dev.zip" *
cd ../..

echo "Success! Drag and drop '.mise/Season 4 Dev.zip' into Prism Launcher to import it."
"""
run_windows = [
    "if not exist pakku-lock.json ( echo pakku-lock.json not found! & exit /b 1 )",
    "if not exist .mise\\prism-instance mkdir .mise\\prism-instance",

    "echo Reading versions from pakku-lock.json and generating Prism pack...",

    "jq \"{ components: [ { important: true, uid: \\\"net.minecraft\\\", version: .mc_versions[0] }, { uid: \\\"net.fabricmc.fabric-loader\\\", version: .loaders.fabric } ], formatVersion: 1 }\" pakku-lock.json > .mise\\prism-instance\\mmc-pack.json",
    
    "echo [General]> .mise\\prism-instance\\instance.cfg",
    "echo InstanceType=OneSix>> .mise\\prism-instance\\instance.cfg",
    "echo OverrideCommands=true>> .mise\\prism-instance\\instance.cfg",
    "echo PreLaunchCommand=$INST_JAVA \"-Ddev.repo.path=%CD:\\=/%\" \"%CD:\\=/%/DevLaunch.java\">> .mise\\prism-instance\\instance.cfg",

    "cd .mise\\prism-instance && jar cMf \"../Season 4 Dev.zip\" *",
    
    "echo Success! Drag and drop '.mise/Season 4 Dev.zip' into Prism Launcher to import it."
]

[tasks.pakku]
description = "Runs the local Pakku jar"
run = "java -jar .mise/pakku.jar"

[tasks."ci:build-server"]
description = "Builds server-deploy.zip artifact using Pakku's exporter"
run = """
echo "Cleaning up old builds..."
rm -rf build server-deploy.zip

echo "Exporting ServerPack via Pakku..."
java -jar .mise/pakku.jar export

mv build/serverpack/*.zip server-deploy.zip
echo "Server artifact generated successfully!"
"""

[tasks."ci:stage-server"]
description = "Unzips the Pakku server artifact into a test folder and preps for boot"
run = """
rm -rf .ci-server
mkdir -p .ci-server

echo "Unzipping deploy artifact for testing..."
unzip -q server-deploy.zip -d .ci-server/

echo "Accepting EULA..."
echo "eula=true" > .ci-server/eula.txt
"""

[tasks."ci:test-server"]
description = "Boots the Fabric server and waits for it to become healthy"
run = """
if [ ! -f pakku-lock.json ]; then
    echo "Error: pakku-lock.json not found in root directory!"
    exit 1
fi

echo "Reading versions from pakku-lock.json..."
MC_VERSION=$(jq -r '.mc_versions[0]' pakku-lock.json)
FABRIC_VERSION=$(jq -r '.loaders.fabric' pakku-lock.json)

INSTALLER_VERSION="1.0.1"

cd .ci-server

echo "Downloading Fabric Server $FABRIC_VERSION for MC $MC_VERSION..."
curl -sLo fabric-server.jar "https://meta.fabricmc.net/v2/versions/loader/${MC_VERSION}/${FABRIC_VERSION}/${INSTALLER_VERSION}/server/jar"

echo "Starting test server..."
java -Xmx2G -Djava.awt.headless=true -jar fabric-server.jar nogui &
SERVER_PID=$!

echo "Waiting for server to become healthy (Timeout: 4 minutes)..."
TIMEOUT=240
ELAPSED=0
INTERVAL=5

while ! mc-monitor status -host localhost -port 25565 > /dev/null 2>&1; do
    # If the process crashed and died, fail early
    if ! kill -0 $SERVER_PID 2>/dev/null; then
        echo "========================================="
        echo "FAILURE: Server process crashed during boot!"
        echo "========================================="
        exit 1
    fi

    if [ $ELAPSED -ge $TIMEOUT ]; then
        echo "========================================="
        echo "FAILURE: Server failed to start within 4 minutes."
        echo "========================================="
        kill $SERVER_PID
        exit 1
    fi
    
    sleep $INTERVAL
    ELAPSED=$((ELAPSED + INTERVAL))
done

echo "========================================="
echo "SUCCESS: Server booted and is responding!"
echo "========================================="
kill $SERVER_PID
exit 0
"""

[shell_alias]
pakku = "java -jar .mise/pakku.jar"

