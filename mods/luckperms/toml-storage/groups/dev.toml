# Ladder: default -> communityrep -> staff -> dev. Each group inherits everything below it.
# After changing communityrep, staff or dev, run 'mise run perms:offduty' to update offduty.toml.

# No '*' here on purpose: offduty can't switch off '*' without breaking mods that allow things by
# default (voice chat etc). Devs are op through luckperms.autoop, which covers anything not listed.

name = "dev"

# Weight
[[permissions]]
permission = "weight.30"
value = true

# Op status (auto-op = true in luckperms.conf)
[[permissions]]
permission = "luckperms.autoop"
value = true

# Staff denies these, and an exact node inherited from staff beats a wildcard, so grant them back
[[permissions]]
permission = "minecraft.command.op"
value = true

[[permissions]]
permission = "minecraft.command.deop"
value = true

[[permissions]]
