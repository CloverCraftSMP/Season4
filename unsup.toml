# =================
#  LOD (CHUNKSMITH)
# =================
# The server always runs Chunksmith (mods/chunksmith.pw.toml). Clients only need it to receive the
# server's pregenerated LOD data, so it ships to them only with a LOD renderer.
chunksmith-client = { flavors = ["voxy", "dh"] }

# =================
#     CREATOR
# =================
flashback = { flavors = ["creator"] }
# The server always runs Axiom (mods/axiom.pw.toml); clients get it only with these flavors.
axiom-client = { flavors = ["creator", "builder"] }

# =================
# BUILDERS / REDSTONERS
# =================
litematica = { flavors = ["builder", "redstoner"] }
syncmatica-client = { flavors = ["builder", "redstoner"] }
minihud = { flavors = ["redstoner"] }
# Shared library for Litematica, MiniHUD and the optional Tweakeroo toggle (packwiz [option] in
# tweakeroo.pw.toml, which unsup shows as its own On/Off choice with flavor id tweakeroo_on).
malilib = { flavors = ["builder", "redstoner", "tweakeroo_on"] }

