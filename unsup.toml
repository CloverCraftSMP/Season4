# ===========
#  FLAVOURS
# ===========

# ===================
# Performance Profile
# ===================

[flavor_groups.profile]
name = "Graphics and Effects"
description = "Choose the profile that best matches your computer's specs."
side = "client"
choices = [{ id = "ultra", name = "Ultra", description = "For high-end PCs. Shader support, advanced physics, and all visual effects." }, { id = "standard", name = "Standard", description = "Balanced performance and visuals. Includes shader support and QoL enhancements." }, { id = "lite", name = "Lite", description = "Maximum performance for low-end laptops and older PCs. Disables shaders, heavy particles, and ambient physics." }]

# ===================
#        LOD
# ===================

[flavor_groups.lod]
name = "Distant Rendering (LODs)"
description = "Render chunks extremely far away. Highly performance-intensive!"
side = "client"
choices = [{ id = "lod_none", name = "None", description = "Standard Minecraft render distance. Best for performance and stability." }, { id = "voxy", name = "Voxy", description = "An advanced, highly performant voxel-based LOD renderer. Great for vanilla-like rendering, but experimental." }, { id = "dh", name = "Distant Horizons", description = "The classic LOD renderer." }]

# ===================
#      CREATOR
# ===================

[flavor_groups.creator]
name = "Content Creator mods"
description = "Mods that are more suited for content creators, includes things like Flashback and Axiom."
side = "client"
choices = [{ id = "creator_none", name = "None", description = "None of that creator nonsense." }, { id = "creator", name = "Content Creator", description = "ME I'M A CREATOR, ME ME!" }]

# ===================
#     BUILDERS
# ===================

[flavor_groups.builder]
name = "Builders"
description = "Tools for planning and sharing big builds."
side = "client"
choices = [{ id = "builder_none", name = "None", description = "No building tools." }, { id = "builder", name = "Builder", description = "Litematica for schematic overlays, Syncmatica to share schematics with other players on the server, and Axiom." }]

# ===================
#    REDSTONERS
# ===================

[flavor_groups.redstone]
name = "Redstoners"
description = "Tools for building and debugging redstone and farms."
side = "client"
choices = [{ id = "redstone_none", name = "None", description = "No redstone tools." }, { id = "redstoner", name = "Redstoner", description = "MiniHUD for light levels, spawn chunks and info lines, plus Litematica and Syncmatica." }]

# ===========
#    MAPS
# ===========
[flavor_groups.map]
name = "Map mods"
description = "Better see and experience the world around you."
side = "client"
choices = [{ id = "map_none", name = "None", description = "None." }, { id = "xaeros-minimap", name = "Xaero's Minimap", description = "Xaero's worldmap and minimap" }, { id = "xaeros", name = "Xaero's Worldmap", description = "Xaero's worldmap ONLY" }, { id = "hoofprint", name = "Hoofprint", description = "Alternative to Xaero's that's much simpler but also less feature complete." }]

