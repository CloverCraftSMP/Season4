version=1
preset=minecraft

source_format=packwiz
source=https://raw.githubusercontent.com/CloverCraftSMP/Season4/prod/pack.toml

offer_change_flavors=true

[branding]
modpack_name=CloverCraft

# Choices preselected in the installer on first launch. Players can still change them, and a saved
# choice always wins. Keys are flavor_groups in unsup.toml, values are choice ids.
[flavors]
profile=standard
lod=lod_none
creator=creator_none
builder=builder_none
redstone=redstone_none
map=xaeros-minimap

# Installer window colours, as RRGGBB hex without a leading #.
[colors]
background=101a13
title=ffffff
subtitle=a8c7ae
progress=5bbf5f
progress_track=2a3d2e
dialog=ffffff
button=5bbf5f
button_text=101a13
question=9be29e
info=7fd3e6
warning=ffcc4d
error=ff6b6b
