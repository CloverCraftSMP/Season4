[general]
help_link = "CHANGE_ME"
formulation_type = "DISCORD"
upload_to = "mclo.gs"
# Anti censoring only versions, IP's are kept censored.
enable_mclogs_anti_ip_like_version_censorer = true

[text]
support_name = "CloverCraft Discord"
support_place = "#tickets channel"
modpack_name = "$BCC.modpackName$ $BCC.modpackVersion$"

[modpack_modlist]
enabled = true
# Must stay non-empty, or the first player to launch is recorded as a creator.
modpack_creators = ["4tz", "thecolonel63"]
# modlist.json is generated by CI when the pack is rendered (.mise/lib/crash-assistant.helper.sh),
# so creators' clients must not overwrite it, and entries the generator doesn't emit stay off.
auto_update = false
add_modloader_jar_name = false
add_resourcepacks = false
add_datapacks = false
add_modlist_txt_as_log = true

[greeting]
shown_greeting = true

[gui_customisation]
theme_file_name = "FlatDarculaLaf"
