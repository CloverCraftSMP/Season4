name: Automated Mod Updates

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch: 

permissions:
  contents: write
  pull-requests: write

jobs:
  update-mods:
    name: Check for Mod Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment (Mise)
        uses: jdx/mise-action@v4

      - name: Run Pakku Update & Generate Log
        run: bash .github/scripts/generate-update-pr.sh

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.CI_PAT }}
          commit-message: "chore(mods): update mod versions via pakku"
          title: "Automated Mod Updates"
          body-path: .ci/pr_body.md
          branch: "auto-update-mods"
          base: "main"
          labels: "dependencies"
          delete-branch: true