name: Automated Mod Updates

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch: 

permissions:
  contents: write
  pull-requests: write

jobs:
  update-mods:
    name: Check for Mod Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment (Mise)
        uses: jdx/mise-action@v4

      - name: Run Pakku Update & Generate Log
        run: |
          mise run ci:update-mods > update_log.txt

          cat update_log.txt

          echo "This PR was auto-generated by \`Pakku\` update task." > pr_body.md
          echo "" >> pr_body.md
          echo "### Pakku Update Log" >> pr_body.md
          echo "\`\`\`text" >> pr_body.md

          sed 's/\x1b\[[0-9;]*m//g' update_log.txt >> pr_body.md

          echo "\`\`\`" >> pr_body.md

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(mods): update mod versions via pakku"
          title: "Automated Mod Updates"
          body-path: pr_body.md
          branch: "auto-update-mods"
          base: "main"
          labels: "dependencies"
          delete-branch: true