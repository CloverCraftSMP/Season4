name: Deploy Staging

# Validates the selected ref, publishes it to the `staging` branch and rolls the staging server onto it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  deploy:
    name: Deploy Staging
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # --force-with-lease needs the remote staging branch

      - uses: ./.github/actions/setup-environment

      - name: Publish pack
        id: publish
        uses: ./.github/actions/publish-pack
        with:
          channel: staging

      - name: Notify staff
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_STAFF_WEBHOOK }}
          title: Staging deploy started
          description: Restarting the staging server onto `${{ steps.publish.outputs.version }}`. Players will be disconnected briefly.

      - name: Deploy server
        uses: ./.github/actions/deploy-server
        with:
          panel-url: ${{ secrets.PTERO_PANEL_URL }}
          api-key: ${{ secrets.PTERO_API_KEY }}
          server-id: ${{ secrets.PTERO_STAGING_SERVER_ID }}
          pack-url: ${{ steps.publish.outputs.pack-url }}

      - name: Notify staff of result
        if: always()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_STAFF_WEBHOOK }}
          status: ${{ job.status }}
          title: Staging deploy ${{ job.status == 'success' && 'finished' || job.status }}
          description: >-
            ${{ job.status == 'success' && 'Staging is up to date, give it a minute to finish booting.' || 'Check the workflow run for details.' }}
          fields: |
            Version|`${{ steps.publish.outputs.version || 'unknown' }}`
            Pack|${{ steps.publish.outputs.pack-url || 'not published' }}

  # Deploy reports its own result; this covers validation failing before anything was touched.
  notify-failure:
    name: Notify Failure
    needs: [validate, deploy]
    if: failure() && needs.deploy.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_STAFF_WEBHOOK }}
          status: failure
          title: Staging deploy failed validation
          description: Nothing was published and the staging server was not touched.
