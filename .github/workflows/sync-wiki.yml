name: Sync Wiki

# Publishes the mod list to the Wiki.js "Season 4 Mods" page.
on:
  push:
    branches: [main]
    paths:
      - mods/**
      - .github/scripts/sync_wiki.py
      - config.pkdev.env
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-wiki
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Mod List
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache Modrinth API responses
        uses: actions/cache@v6
        with:
          path: .cache/modrinth
          key: modrinth-api-${{ runner.os }}-${{ hashFiles('mods/*.pw.toml') }}
          restore-keys: modrinth-api-${{ runner.os }}-

      # The wiki URL lives in config.pkdev.env next to the other pack settings; only the token is secret.
      - name: Read wiki URL
        run: |
          set -euo pipefail
          url="$(sed -n 's/^WIKIJS_URL *= *"\(.*\)"$/\1/p' config.pkdev.env)"
          [[ -n "$url" ]] || { echo "::error::WIKIJS_URL is missing from config.pkdev.env"; exit 1; }
          echo "WIKIJS_URL=$url" >> "$GITHUB_ENV"

      - name: Sync to Wiki.js
        env:
          WIKIJS_API_TOKEN: ${{ secrets.WIKIJS_API_TOKEN }}
        run: python .github/scripts/sync_wiki.py
