name: Sync Wiki

# Publishes the mod list to the Wiki.js "Season 4 Mods" page.
on:
  push:
    branches: [main]
    paths:
      - mods/**
      - .github/scripts/sync_wiki.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-wiki
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Mod List
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache Modrinth API responses
        uses: actions/cache@v6
        with:
          path: .cache/modrinth
          key: modrinth-api-${{ runner.os }}-${{ hashFiles('mods/*.pw.toml') }}
          restore-keys: modrinth-api-${{ runner.os }}-

      - name: Sync to Wiki.js
        env:
          WIKIJS_URL: ${{ secrets.WIKIJS_URL }}
          WIKIJS_API_TOKEN: ${{ secrets.WIKIJS_API_TOKEN }}
        run: python .github/scripts/sync_wiki.py
