name: Sync Modpack to Wiki.js

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mods/**'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache Modrinth API responses
        uses: actions/cache@v6
        with:
          path: .cache/modrinth
          key: modrinth-api-${{ runner.os }}-${{ hashFiles('mods/*.pw.toml') }}
          restore-keys: |
            modrinth-api-${{ runner.os }}-

      - name: Run Wiki Sync Script
        env:
          WIKIJS_URL: ${{ secrets.WIKIJS_URL }}
          WIKIJS_API_TOKEN: ${{ secrets.WIKIJS_API_TOKEN }}
        run: python .github/scripts/sync_wiki.py