name: Release

# Pushing a vX.Y.Z tag validates the tagged commit, checks CHANGELOG.md has release notes, builds the
# prod clients, backs up and deploys prod, publishes a GitHub release with the clients attached and
# announces it, then files the [Unreleased] changelog entries under the new version on main.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  # Fails the release before anything is deployed if there's nothing to announce.
  changelog:
    name: Release Notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.notes.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-environment

      - name: Read release notes
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="$(mise run --quiet ci:release-notes "$version")"
          {
            echo "version=$version"
            echo 'notes<<RELEASE_NOTES_EOF'
            printf '%s\n' "$notes"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
          { echo "## Release notes for $version"; echo; printf '%s\n' "$notes"; } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      channel: prod

  deploy:
    name: Deploy Production
    needs: [build, changelog]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: write
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # --force-with-lease needs the remote prod branch

      - uses: ./.github/actions/setup-environment

      - name: Publish pack
        id: publish
        uses: ./.github/actions/publish-pack
        with:
          channel: prod

      - name: Notify staff
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_STAFF_WEBHOOK }}
          title: Production deploy started
          description: Backing up and restarting the production server onto `${{ steps.publish.outputs.version }}`.

      - name: Deploy server
        uses: ./.github/actions/deploy-server
        with:
          panel-url: ${{ secrets.PTERO_PANEL_URL }}
          api-key: ${{ secrets.PTERO_API_KEY }}
          server-id: ${{ secrets.PTERO_PROD_SERVER_ID }}
          pack-url: ${{ steps.publish.outputs.pack-url }}
          backup: pre-release-${{ steps.publish.outputs.version }}

      - name: Notify staff of result
        if: always()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_STAFF_WEBHOOK }}
          status: ${{ job.status }}
          title: Production deploy ${{ job.status == 'success' && 'finished' || job.status }}
          description: >-
            ${{ job.status == 'success' && 'Production is restarting on the new pack. The GitHub release and public announcement are next.' || 'Check the workflow run. The pre-release backup is in the panel if prod needs rolling back.' }}
          fields: |
            Version|`${{ steps.publish.outputs.version || 'unknown' }}`
            Backup|`pre-release-${{ steps.publish.outputs.version || 'unknown' }}`

  release:
    name: Publish Release
    needs: [build, changelog, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download clients
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: build/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ needs.changelog.outputs.notes }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes "$NOTES" build/*

      - name: Announce release
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
          content: ${{ vars.DISCORD_ANNOUNCE_ROLE_ID && format('<@&{0}>', vars.DISCORD_ANNOUNCE_ROLE_ID) || '' }}
          status: success
          title: Season 4 ${{ github.ref_name }} is out!
          url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          description: ${{ needs.changelog.outputs.notes }}
          fields: |
            Prism|[prism.zip](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/prism-unsup-prod.zip)
            Universal|[universal.mrpack](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/unsup-prod.mrpack)

  # Files this release's [Unreleased] entries under its version on main. Uses the bot app (as in
  # mod-updater) so the push can get past branch protection; add the app to the bypass list if needed.
  update-changelog:
    name: Update Changelog
    needs: [changelog, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - uses: ./.github/actions/setup-environment

      - name: Release [Unreleased] as ${{ needs.changelog.outputs.version }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ needs.changelog.outputs.version }}
          NOTES: ${{ needs.changelog.outputs.notes }}
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$NOTES" > "$expected"
          mise run ci:finalize-changelog "$VERSION" "$expected"

          if git diff --quiet -- CHANGELOG.md; then
            echo "::notice::CHANGELOG.md already lists $VERSION"
            exit 0
          fi

          id="$(gh api "/users/${SLUG}[bot]" --jq .id)"
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
          git commit --quiet -m "docs(changelog): release $VERSION" -- CHANGELOG.md
          git push origin HEAD:main

  # Deploy reports its own result; this covers everything else failing.
  notify-failure:
    name: Notify Failure
    needs: [validate, changelog, build, deploy, release, update-changelog]
    if: failure() && needs.deploy.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_STAFF_WEBHOOK }}
          status: failure
          title: Release ${{ github.ref_name }} failed
          description: >-
            ${{ needs.release.result == 'success' && format('The release went out, but CHANGELOG.md on main still lists these changes under [Unreleased]. Move them under [{0}] by hand.', needs.changelog.outputs.version) || needs.deploy.result == 'success' && 'Production was deployed, but publishing the GitHub release failed. The public announcement was not sent.' || needs.changelog.result == 'failure' && 'CHANGELOG.md has nothing under [Unreleased]. Write the release notes, then delete and re-push the tag. Production was not touched.' || 'Production was not touched.' }}
          fields: |
            Validate|${{ needs.validate.result }}
            Changelog|${{ needs.changelog.result }}
            Build|${{ needs.build.result }}
            Deploy|${{ needs.deploy.result }}
            Release|${{ needs.release.result }}
            Changelog push|${{ needs.update-changelog.result }}
