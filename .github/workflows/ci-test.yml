name: Server Boot Test

on:
  push:
    branches: [ main ]
    paths:
      - '.pakku/**'
      - 'pakku.json'
      - 'pakku-lock.json'
  pull_request:
    branches: [ main ]
    paths:
      - '.pakku/**'
      - 'pakku.json'
      - 'pakku-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Environment (Mise)
        uses: jdx/mise-action@v4

      - name: Run pipeline
        run: mise run ci:run

      - name: Save Deploy Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Server-Package
          path: .ci/artifacts/*.zip
          retention-days: 14

      - name: Save Crash Logs (On Failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Server-Crash-Logs
          path: |
            .ci-server/logs/
            .ci-server/crash-reports/
          retention-days: 14

      - name: Prune Old Artifacts
        if: always() 
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/prune-artifacts.sh