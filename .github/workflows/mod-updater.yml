name: Update Mods

# Runs packwiz's updater on a schedule and opens (or refreshes) a PR with the result.
on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-mods
  cancel-in-progress: false

jobs:
  update:
    name: Update Mods
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # A GitHub App token (rather than GITHUB_TOKEN) so the PR triggers Validate.
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write # labels

      - name: Resolve bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id="$(gh api "/users/${SLUG}[bot]" --jq .id)"
          echo "identity=${SLUG}[bot] <${id}+${SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: ./.github/actions/setup-environment

      - name: Update mods
        run: mise run ci:generate-pr

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          author: ${{ steps.bot.outputs.identity }}
          committer: ${{ steps.bot.outputs.identity }}
          commit-message: 'chore(mods): update mod versions via packwiz'
          title: Automated Mod Updates
          body-path: run/ci/pr_body.md
          branch: auto-update-mods
          base: main
          labels: dependencies
          delete-branch: true

      - name: Summarise
        if: always()
        run: |
          if [[ -f run/ci/pr_body.md ]]; then
            { echo '## Automated Mod Updates'; echo; cat run/ci/pr_body.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The updater failed before it could write a summary.' >> "$GITHUB_STEP_SUMMARY"
          fi
