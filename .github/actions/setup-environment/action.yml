name: Setup environment
description: Installs the mise toolchain and restores the mod jar cache. Check the repository out first.

runs:
  using: composite
  steps:
    - name: Install mise tools
      uses: jdx/mise-action@v5
      with:
        cache: true

    # Mod jars downloaded when rendering the pack (Crash Assistant's modlist.json), keyed by sha512.
    - name: Cache mod jars
      uses: actions/cache@v6
      with:
        path: .mise/cache/mods
        key: mod-jars-${{ hashFiles('mods/*.pw.toml') }}
        restore-keys: mod-jars-
