name: 'Setup environment'
description: 'Configures the action to use mise'

runs:
  using: 'composite'
  steps:
    - name: Pull repository
      uses: actions/checkout@v7

    - name: Setup mise
      uses: jdx/mise-action@v5

    - name: Cache mise environment
      uses: actions/cache@v6
      with:
        path: |
          ~/.local/share/mise
          ~/.cache/mise
        key: ${{ runner.os }}-mise-${{ hashFiles('mise.toml') }}
        restore-keys: |
          ${{ runner.os }}-mise-
